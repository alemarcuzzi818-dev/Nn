name: Compilar Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: ☕ Instalar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 🛠️ Generar Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            mkdir -p gradle/wrapper
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.2-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v7.2.0/gradle/wrapper/gradle-wrapper.jar
            curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v7.2.0/gradlew
            curl -L -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v7.2.0/gradlew.bat
          fi
          chmod +x gradlew

      - name: 🔨 Compilar el mod
        run: ./gradlew build

      - name: 📤 Subir archivo .jar
        uses: actions/upload-artifact@v4
        with:
          name: Armas-Mod-1.16.5
          path: build/libs/*.jar
          
