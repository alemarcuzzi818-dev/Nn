name: Compilar Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: ☕ Instalar Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 🛠️ Dar permisos a Gradle
        run: chmod +x gradlew

      - name: 🔨 Compilar el mod
        run: ./gradlew build

      - name: 📤 Subir archivo .jar
        uses: actions/upload-artifact@v4
        with:
          name: Armas-Mod-1.16.5
          path: build/libs/*.jar
          
